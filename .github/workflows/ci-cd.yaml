
name: Flask CI-CD with GitOps
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: flask-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ------------------------------------------
  # JOB 1: Application Testing
  # ------------------------------------------
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application tests
        run: |
          python -m pytest -v


  # ------------------------------------------
  # JOB 2: Build, Push and Update GitOps
  # ------------------------------------------
  build-and-update-gitops:
    name: Build Image and Update GitOps
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:

      # Checkout application repository
      - name: Checkout application
        uses: actions/checkout@v4

      # Generate lowercase GHCR image name
      - name: Set image name
        id: image
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/flask-cicd-app" >> "$GITHUB_OUTPUT"

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Verify GHCR authentication and configuration
      - name: Verify GHCR configuration
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"
          echo "Image: $IMAGE"

          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: GITHUB_TOKEN is missing"
            exit 1
          fi

          echo "GITHUB_TOKEN is available"

      # Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Checkout GitOps repository
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: asrafhasib/flask-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops

      # Update Kubernetes deployment manifest
      - name: Update GitOps deployment manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("gitops/apps/flask-app/deployment.yaml")

          if not manifest.exists():
              raise SystemExit(f"Manifest not found: {manifest}")

          content = manifest.read_text()

          # Update flask-app container image
          pattern = r'(^\s*image:\s*).*$'
          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + os.environ["IMAGE"],
              content,
              count=1,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit("Could not find container image in deployment.yaml")

          # Update APP_VERSION environment variable
          version_pattern = (
              r'(^\s*-\s*name:\s*APP_VERSION\s*\n'
              r'\s*value:\s*).*$'
          )

          updated, count = re.subn(
              version_pattern,
              lambda m: m.group(1) + '"' + os.environ["VERSION"] + '"',
              updated,
              count=1,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit(
                  "Could not find APP_VERSION environment variable "
                  "in deployment.yaml"
              )

          manifest.write_text(updated)

          print("GitOps manifest updated successfully")
          print(f"Image: {os.environ['IMAGE']}")
          print(f"Version: {os.environ['VERSION']}")
          PY

      # Commit and push GitOps changes
      - name: Commit and Push GitOps Changes
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/flask-app/deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi

          git commit -m "Deploy flask-cicd-app ${IMAGE_TAG}"

          git push origin main

      # Deployment information
      - name: Deployment summary
        if: success()
        run: |
          echo "## Flask CI/CD Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Application: flask-cicd-app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ steps.image.outputs.name }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latest tag: ${{ steps.image.outputs.name }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitOps: Updated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Argo CD: Ready to synchronize" >> "$GITHUB_STEP_SUMMARY"
