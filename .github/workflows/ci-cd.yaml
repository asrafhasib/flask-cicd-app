name: Flask CI-CD with GitOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: flask-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  build-and-update-gitops:
    name: Build image and update GitOps
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER}/flask-cicd-app" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: asrafhasib/flask-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops

      - name: Update image and application version
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("gitops/apps/flask-app/deployment.yaml")
          content = manifest.read_text()

          lines = content.splitlines()
          updated = []
          in_container = False
          for line in lines:
              if line.strip() == "- name: flask-app":
                  in_container = True
              if in_container and line.strip().startswith("image:"):
                  line = line[:len(line) - len(line.lstrip())] + "image: " + os.environ["IMAGE"]
              if in_container and line.strip() == 'value: "initial"':
                  line = line.replace('"initial"', '"' + os.environ["VERSION"] + '"')
              updated.append(line)

          # Always update APP_VERSION, including after the first deployment.
          text = "\n".join(updated) + "\n"
          marker = 'name: APP_VERSION'
          if marker in text:
              before, after = text.split(marker, 1)
              after_lines = after.splitlines()
              for i, item in enumerate(after_lines):
                  if item.strip().startswith("value:"):
                      after_lines[i] = '              value: "' + os.environ["VERSION"] + '"'
                      break
              text = before + marker + "\n".join(after_lines)
          manifest.write_text(text)
          PY

      - name: Commit and push GitOps change
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flask-app/deployment.yaml
          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi
          git commit -m "Deploy flask-cicd-app ${IMAGE_TAG}"
          git push origin main
